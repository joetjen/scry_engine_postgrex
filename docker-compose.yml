# A disposable, local Postgres for running this package's own test suite
# against a real database -- `docker compose up -d` before `mix test`/
# `mix precommit` (see README.md). Connection details here are the
# defaults `test/support/test_conn.ex` assumes; override via
# PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE if you point tests at a
# different (e.g. already-running, non-Docker) Postgres instead.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scry
      POSTGRES_PASSWORD: scry
      POSTGRES_DB: scry_engine_relational_postgrex_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scry -d scry_engine_relational_postgrex_test"]
      interval: 2s
      timeout: 2s
      retries: 15
